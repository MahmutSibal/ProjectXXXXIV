# MonsterASP paylaşımlı IIS barındırmada, bir süre istek almayan uygulama havuzu
# kapatılır. Kapandığında arka plan servisleri (abonelik yenileme, süre dolumu) da
# durur ve bir sonraki isteği yapan kişi soğuk başlangıcı bekler.
#
# WhatsApp servisi için sonuç daha ağır: süreç ölünce WhatsApp bağlantısı düşer ve
# yeniden bağlanana kadar doğrulama kodu gönderilemez.
#
# /api/health bilerek veritabanına DOKUNMAZ; /api/health/ready kullanmayın.
name: Sunucuyu ayakta tut

on:
  schedule:
    # GitHub Actions'ta en sık aralık 5 dakikadır. Yoğunlukta zamanlama gecikebilir,
    # bu yüzden 10 dakika seçildi: gecikse bile havuz zaman aşımına yaklaşmaz.
    - cron: '*/10 * * * *'
  # Panelden elle tetiklemek için (kurulumu doğrularken işe yarar).
  workflow_dispatch:

# Bir tur gecikirse sıraya girip birikmesin; en günceli yeter.
concurrency:
  group: keep-alive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    strategy:
      # Biri düşerse diğerinin denenmesini engellemesin.
      fail-fast: false
      matrix:
        include:
          - ad: API
            url: https://mahmutapp.tryasp.net/api/health
            beklenen: '200'
          # WhatsApp servisi jeton ister; jetonu buraya koymuyoruz (depoya sır
          # yazılmaz). Kimliksiz istek 401 döner — bu da süreci uyandırmak için
          # yeterlidir, çünkü isteği yanıtlayan zaten Node sürecidir.
          - ad: WhatsApp
            url: https://whatsappsukran.tryasp.net/status
            beklenen: '401'
    steps:
      - name: ${{ matrix.ad }} servisini uyandır
        env:
          HEDEF: ${{ matrix.url }}
          BEKLENEN: ${{ matrix.beklenen }}
        run: |
          # Soğuk başlangıçta ilk istek yavaş olabilir: cömert zaman aşımı ve
          # yeniden deneme veriyoruz. Amaç zaten süreci uyandırmak.
          kod=$(curl --silent --show-error --location \
                     --max-time 90 --retry 3 --retry-delay 10 --retry-all-errors \
                     --output /dev/null --write-out '%{http_code}' \
                     "$HEDEF")

          echo "HTTP $kod  ($HEDEF)"

          if [ "$kod" != "$BEKLENEN" ]; then
            echo "::error::Beklenen HTTP $BEKLENEN, gelen $kod. Servis kapalı olabilir."
            exit 1
          fi
