<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Şükran App — Restoran Yönetim Sistemi</title>
    <meta name="description" content="QR menü, masa siparişi ve ödeme yönetimini tek panelden yürüten restoran çözümü." />

    <!-- Sekme ikonu. Favicon, logonun tamamı değil AMBLEM kısmıdır: rozetin
         içindeki "ŞÜKRAN APP / Restoran & Otomasyon" yazısı 16 pikselde okunmaz
         bir lekeye dönüşüyordu. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png" />

    <!-- iOS ana ekran ikonu. Misafirler QR menüyü telefonda açıyor; "Ana Ekrana
         Ekle" dediklerinde bu görünür, tanımlı değilse iOS sayfanın ekran
         görüntüsünü kullanır. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Mobil tarayıcıda adres çubuğu rengi (marka yeşili) -->
    <meta name="theme-color" content="#182912" />

    <!-- Bağlantı önizlemesi. Bu ürünün bağlantıları WhatsApp'ta paylaşılıyor;
         bu etiketler olmadan çıplak bir URL görünür. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Şükran App" />
    <meta property="og:title" content="Şükran App — Restoran Yönetim Sistemi" />
    <meta property="og:description" content="QR menü, masa siparişi ve ödeme yönetimini tek panelden yürütün." />
    <meta property="og:url" content="https://sukranapp.runasp.net/" />
    <meta property="og:image" content="https://sukranapp.runasp.net/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="tr_TR" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:wght@600;700&display=swap&subset=latin,latin-ext" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
